name: Collect and verify official error codes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 0"
  push:
    branches: [main]
    paths:
      - "data/source_registry.json"
      - "tools/collect_candidates.py"
      - "tools/collectors.py"
      - "tools/collect_extra_sources.py"
      - "tools/collect_fujitsu_app.py"
      - "tools/promote_verified.py"
      - "tools/promote_verified_extended.py"
      - ".github/workflows/collect-candidates.yml"

permissions:
  contents: write

concurrency:
  group: collect-official-error-candidates
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect candidates from registered official pages
        run: python3 tools/collect_candidates.py

      - name: Collect Sharp washer diagnosis pages
        run: python3 tools/collect_extra_sources.py

      - name: Collect Fujitsu Nocria app error table
        run: python3 tools/collect_fujitsu_app.py

      - name: Strictly verify and promote dedicated candidates
        env:
          AUTO_PROMOTE_LIMIT: "10000"
        run: python3 tools/promote_verified_extended.py

      - name: Commit collected and verified data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/candidates.json review/discovered_sources.json review/promotion-report.json data/errors.json
          if git diff --cached --quiet; then
            echo "No collected or verified changes."
            exit 0
          fi
          git commit -m "Auto-promote strictly verified official error codes"
          git pull --rebase origin main
          git push
