name: Collect and verify official error codes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 0"
  push:
    branches: [main]
    paths:
      - "data/source_registry.json"
      - "data/category_source_registry.json"
      - "tools/collect_candidates.py"
      - "tools/collectors.py"
      - "tools/collect_extra_sources.py"
      - "tools/collect_fujitsu_app.py"
      - "tools/collect_category_tables.py"
      - "tools/collect_haier_categories.py"
      - "tools/collect_sharp_categories.py"
      - "tools/collect_sharp_airpurifier.py"
      - "tools/collect_chofu.py"
      - "tools/collect_misc_official.py"
      - "tools/collect_misc_official_safe.py"
      - "tools/collect_iris_siroca.py"
      - "tools/collect_eufy_delonghi.py"
      - "tools/collect_rinnai_faq.py"
      - "tools/collect_noritz_faq.py"
      - "tools/promote_verified.py"
      - "tools/promote_verified_extended.py"
      - "tools/promote_all_verified.py"
      - ".github/workflows/collect-candidates.yml"

permissions:
  contents: write

concurrency:
  group: collect-official-error-candidates
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect candidates from registered official pages
        run: python3 tools/collect_candidates.py

      - name: Collect Sharp washer diagnosis pages
        run: python3 tools/collect_extra_sources.py

      - name: Collect Fujitsu Nocria app error table
        run: python3 tools/collect_fujitsu_app.py

      - name: Collect configured official category tables
        run: python3 tools/collect_category_tables.py

      - name: Collect Haier additional product categories
        run: python3 tools/collect_haier_categories.py

      - name: Collect Sharp additional diagnosis categories
        run: python3 tools/collect_sharp_categories.py

      - name: Collect Sharp air purifier series
        run: python3 tools/collect_sharp_airpurifier.py

      - name: Collect CHOFU official all-category error tables
        run: python3 tools/collect_chofu.py

      - name: Collect Toyotomi and Dainichi official categories
        run: python3 tools/collect_misc_official_safe.py

      - name: Collect Iris Ohyama and Siroca official categories
        run: python3 tools/collect_iris_siroca.py

      - name: Collect Eufy and DeLonghi official categories
        run: python3 tools/collect_eufy_delonghi.py

      - name: Collect Rinnai official FAQ error catalog
        run: python3 tools/collect_rinnai_faq.py

      - name: Collect Noritz official FAQ error catalog
        run: python3 tools/collect_noritz_faq.py

      - name: Strictly verify and promote every eligible candidate
        run: python3 tools/promote_all_verified.py

      - name: Generate production search and SEO pages
        env:
          SITE_URL: https://nano-tani.github.io/kaden-error-checker
        run: python3 tools/generate.py

      - name: Commit collected verified and generated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/candidates.json review/discovered_sources.json review/promotion-report.json data/errors.json data/search-index.json errors code sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No collected, verified, or generated changes."
            exit 0
          fi
          git commit -m "Auto-promote and generate all verified official error codes"
          git pull --rebase origin main
          git push
